[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airflow-provider-anakin"
version = "0.2.0"
description = "Apache Airflow provider for Anakin: scrape, crawl, search, Wire site actions, website monitors and AI browser tasks from your DAGs"
license = { text = "Apache-2.0" }
authors = [{ name = "Anakin", email = "support@anakin.io" }]
keywords = ["airflow", "airflow-provider", "anakin", "web-scraping", "crawler", "web-data"]
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Apache Airflow",
    "Framework :: Apache Airflow :: Provider",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: System :: Monitoring",
]
requires-python = ">=3.10,<4.0"
dependencies = [
    "apache-airflow>=2.10.0",
    "anakin-sdk>=0.2.0,<0.3.0",
    "httpx>=0.27",
]

# Tells Airflow's provider manager where to find this package's metadata.
# Entry-point group name ("apache_airflow_provider") and target shape
# ("<module>:get_provider_info") confirmed against Airflow's own
# "Creating a custom provider" docs and the astronomer/airflow-provider-sample
# reference implementation's pyproject.toml — not guessed.
[project.entry-points.apache_airflow_provider]
provider_info = "anakin_provider:get_provider_info"

[project.urls]
Homepage = "https://anakin.io"
Documentation = "https://anakin.io/docs/integrations/workflow/airflow"
Repository = "https://github.com/Anakin-Inc/airflow-provider-anakin"
Issues = "https://github.com/Anakin-Inc/airflow-provider-anakin/issues"
Changelog = "https://github.com/Anakin-Inc/airflow-provider-anakin/blob/main/CHANGELOG.md"

[dependency-groups]
test = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-mock>=3.10.0,<4.0.0",
]
lint = [
    "ruff>=0.6",
    "mypy>=1.10.0,<2.0.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["anakin_provider"]
known-third-party = ["anakin"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"

[tool.mypy]
disallow_untyped_defs = true

[tool.hatch.build.targets.wheel]
packages = ["anakin_provider"]
