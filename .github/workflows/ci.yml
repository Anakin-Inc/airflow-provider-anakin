name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          uv venv
          uv pip install -e . --group test --group lint
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy anakin_provider

  test:
    name: Airflow ${{ matrix.airflow }} / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { airflow: "2.10.5", python: "3.10" }
          - { airflow: "2.10.5", python: "3.12" }
          - { airflow: "3.3.2", python: "3.10" }
          - { airflow: "3.3.2", python: "3.13" }
    env:
      AIRFLOW_HOME: ${{ github.workspace }}/.airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install Airflow ${{ matrix.airflow }} with its constraints
        run: |
          uv venv
          uv pip install "apache-airflow==${{ matrix.airflow }}" \
            -c "https://raw.githubusercontent.com/apache/airflow/constraints-${{ matrix.airflow }}/constraints-${{ matrix.python }}.txt"
          uv pip install -e . --group test
      - name: Test
        run: uv run --no-sync pytest
      - name: Provider is discovered and example DAGs import
        run: |
          uv run --no-sync airflow providers get airflow-provider-anakin
          uv run --no-sync python -c "
          from airflow.models.dagbag import DagBag
          bag = DagBag('example_dags')
          assert not bag.import_errors, bag.import_errors
          assert {'example_anakin', 'example_anakin_advanced'} <= set(bag.dags), bag.dags
          "

  build:
    name: Build and install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv build --out-dir dist
      - run: uvx twine check --strict dist/*
      - name: Install the wheel
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke dist/*.whl
          /tmp/smoke/bin/python -c "
          import anakin_provider.operators.anakin as ops
          names = [n for n in dir(ops) if n.startswith('Anakin') and n.endswith('Operator')]
          assert len(names) == 22, names
          "
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
